<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración general de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Seccional Retiro</title>

    <!-- Tipografía institucional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Vinculación con la hoja de estilos CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Biblioteca de íconos Lucide -->
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>

<body>

    <!-- Encabezado: logos institucionales -->
    <header class="encabezado">
        <img src="assets/img/logo-seccional-retiro.png" alt="Logo de Seccional Retiro">

        <img src="assets/img/logo-delicia-conduccion.png" alt="Logo de Delicia Conducción">
    </header>

    <!-- Presentación principal de la página -->
    <main>
        <h1>Seccional Retiro</h1>
        <p>Información para nuestras <br> compañeras y compañeros.</p>

        <!-- Accesos principales de la página -->
        <section class="secciones-principales">

            <a href="afiliacionyempadronamiento.html" class="tarjeta tarjeta-ancha">
                <span class="icono-tarjeta">
                    <i data-lucide="users"></i>
                </span>
                <span>Afiliación y empadronamiento</span>
                <i data-lucide="chevron-right" class="flecha-tarjeta"></i>
            </a>

            <a href="beneficios.html" class="tarjeta">
                <span class="icono-tarjeta">
                    <i data-lucide="gift"></i>
                </span>
                <span>Beneficios</span>
            </a>

            <a href="turismo.html" class="tarjeta">
                <span class="icono-tarjeta">
                    <i data-lucide="luggage"></i>
                </span>
                <span>Turismo</span>
            </a>

            <a href="formularios.html" class="tarjeta">
                <span class="icono-tarjeta">
                    <i data-lucide="file-text"></i>
                </span>
                <span>Formularios</span>
            </a>

            <a href="newsletters.html" class="tarjeta">
                <span class="icono-tarjeta">
                    <i data-lucide="newspaper"></i>
                </span>
                <span>Newsletters</span>
            </a>

            <a href="oficinas.html" class="tarjeta tarjeta-ancha">
                <span class="icono-tarjeta">
                    <i data-lucide="building-2"></i>
                </span>
                <span>Oficinas sindicales</span>
                <i data-lucide="chevron-right" class="flecha-tarjeta"></i>
            </a>

        </section>
    </main>

    <!-- Pie de página -->
    <footer class="pie-pagina">
        <p>© Seccional Retiro</p>
    </footer>

    <!-- Activación de los íconos Lucide -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>

</body>

</html>
